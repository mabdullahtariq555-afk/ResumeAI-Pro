<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--border:#e5e7eb;--ok:#16a34a;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.nav{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:800;color:var(--p)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border-radius:9px;background:#eef0ff;color:var(--p);font-weight:700;font-size:12px}.btn.primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.btn.danger{background:#fee2e2;color:var(--danger)}.btn.dark{background:#172033;color:#fff}.btn.ghost{background:transparent;color:var(--text)}.btn:disabled{opacity:.55;cursor:not-allowed}
.app{padding:24px 4%;max-width:1500px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.topbar h1{margin:0}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel,.card{background:#fff;border:1px solid var(--border);border-radius:13px}.stat{padding:16px}.stat b{font-size:25px}.builder{display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,1fr);gap:18px}.panel{padding:18px}.preview-wrap{position:sticky;top:86px;max-height:calc(100vh - 100px);overflow:auto}.section{border-top:1px solid var(--border);padding:17px 0}.section:first-child{border-top:0;padding-top:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section h3{margin:0 0 10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:95px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid var(--border);border-radius:9px;padding:12px;margin:10px 0;background:#fafafa}.tag{display:inline-block;background:#eef0ff;color:#3730a3;padding:5px 8px;border-radius:6px;margin:3px;font-size:11px}
.resume-page{background:#fff;min-height:1050px;padding:45px;box-shadow:0 5px 20px #00000014;color:#172033}.resume-page h1{margin:0 0 5px;font-size:34px}.resume-page .contact{color:#667085;font-size:13px;margin-bottom:25px}.resume-page h2{font-size:16px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #ddd;padding-bottom:5px;margin-top:24px}.resume-page p{line-height:1.55}.resume-page ul{padding-left:20px}.resume-page.modern{border-top:10px solid var(--accent,#4f46e5)}.resume-page.classic{font-family:Georgia,serif}.resume-page.minimal{padding:55px 65px}.resume-page.executive{border-left:8px solid var(--accent,#4f46e5);padding-left:38px}.resume-page.creative{border-radius:16px;border-top:14px solid var(--accent,#4f46e5)}.resume-page.corporate h2{border-bottom:3px solid var(--accent,#4f46e5)}.resume-page.elegant{font-family:Georgia,serif}.resume-page.compact{padding:32px}.resume-page.compact h2{margin-top:15px}.resume-page.compact p{line-height:1.35}.resume-page.tech{font-family:Consolas,monospace}.resume-page.tech h2{color:var(--accent,#4f46e5);border-bottom:1px solid currentColor}.resume-page.academic{font-family:Georgia,serif}.resume-page.academic h2{text-transform:none;letter-spacing:0}.resume-page.bold{border-top:16px solid var(--accent,#4f46e5)}.resume-page.bold h1{font-size:40px}.resume-page.clean h2{border-bottom:1px solid #bbb}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:14px;width:min(1100px,100%);max-height:94vh;overflow:auto;padding:22px}.preview-modal{width:min(1100px,96vw)}.full-preview{overflow:auto;padding:18px 8px 30px;min-height:300px;background:#f5f6f8}.full-preview .professional-resume{width:210mm;min-height:297mm;box-sizing:border-box}.full-preview .professional-resume{margin:0 auto;box-shadow:0 5px 20px #00000014}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;z-index:30}.cover{background:#fff;border:1px solid var(--border);padding:22px;border-radius:10px;line-height:1.7;white-space:normal}.score{font-weight:800;color:var(--ok)}.status{font-size:11px;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#166534}.status.off{background:#fff7ed;color:#9a3412}
.professional-resume{width:100%;max-width:820px;min-height:1050px;margin:auto;padding:48px 54px;background:#fff;color:#172033;font-family:Arial,Helvetica,sans-serif}.resume-header{padding-bottom:20px;border-bottom:2px solid #1e293b}.resume-header h1{margin:0;font-size:34px;line-height:1.1}.resume-headline{margin-top:8px;font-size:15px;color:#475569}.resume-contact{margin-top:12px;font-size:11px;color:#64748b;word-break:break-word}.resume-section{margin-top:22px}.resume-section h2{margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid #cbd5e1;color:#0f172a;font-size:13px;text-transform:uppercase;letter-spacing:1.2px}.resume-section p,.resume-section li{font-size:12px;line-height:1.55}.resume-section ul{margin:7px 0 0;padding-left:18px}.resume-entry{margin-bottom:15px}.entry-top{display:flex;justify-content:space-between;gap:15px;font-size:13px}.entry-top span{color:#64748b;font-size:11px;white-space:nowrap}.entry-company{margin-top:3px;color:#475569;font-size:12px;font-weight:600}.entry-link{color:#2563eb;font-size:11px}.skill-list{display:flex;flex-wrap:wrap;gap:6px}.skill-list span{padding:4px 8px;border:1px solid #cbd5e1;border-radius:4px;font-size:11px}.professional-resume.modern{border-top:10px solid #1e293b}.professional-resume.classic{font-family:Georgia,serif}.professional-resume.classic .resume-header{text-align:center}.professional-resume.minimal{border-left:7px solid #64748b}.professional-resume.executive{border-top:14px solid #0f172a}.professional-resume.corporate{border-top:10px solid #2563eb}.professional-resume.creative{border-left:12px solid #7c3aed}.professional-resume.academic{font-family:Georgia,serif;border:2px solid #334155}.professional-resume.compact{padding:32px 38px}.professional-resume.compact .resume-section{margin-top:13px}.professional-resume.technical{border-top:10px solid #0891b2}.professional-resume.elegant{border-top:5px solid #a16207;font-family:Georgia,serif}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}.diff>div{padding:10px;border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;font-size:12px}.before{background:#fff7f7}.after{background:#f3fff6}
@media(max-width:1000px){.builder{grid-template-columns:1fr}.preview-wrap{position:static;max-height:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid2,.stats{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.app{padding:15px}.professional-resume{padding:30px 25px}}
</style>
